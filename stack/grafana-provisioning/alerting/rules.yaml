apiVersion: 1
groups:
    - orgId: 1
      name: panther-service-health
      folder: Panther Alerts
      interval: 1m
      rules:
        - uid: fftnxblhqi0aod
          title: High Error Rate
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PAE45454D0EDB9216
              model:
                expr: 100 * sum by (job) (rate(http_server_duration_count{http_status_code=~"5.."}[5m])) / sum by (job) (rate(http_server_duration_count[5m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 10
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $labels.job }} error rate is above 10%'
          labels:
            severity: warning
          isPaused: false
        - uid: dftnxdciwrchsf
          title: High p95 Latency
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PAE45454D0EDB9216
              model:
                expr: histogram_quantile(0.95, sum by (job, le) (rate(http_server_duration_bucket[5m])))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1000
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $labels.job }} p95 latency is above 1s'
          labels:
            severity: warning
          isPaused: false
        - uid: aftnxfttelblsd
          title: High Error Log Volume
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: P8E80F9AEF21F6940
              model:
                expr: sum by (service_name) (count_over_time({detected_level="ERROR"}[5m]))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 20
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 5m
          annotations:
            summary: '{{ $labels.service_name }} logged more than 20 ERROR lines in 5m'
          labels:
            severity: warning
          isPaused: false
        - uid: eftnxi1bv8ge8f
          title: Services Missing
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PAE45454D0EDB9216
              model:
                expr: count(count by (job) (nodejs_eventloop_delay_mean))
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 5m
          annotations:
            summary: Fewer than 5 Panther services are reporting telemetry - one or more may be down
          labels:
            severity: critical
          isPaused: false
